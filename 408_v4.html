    // 遗忘次数 +1，记录本次遗忘时间到 forgetEvents 并重渲染
    async function incrementForget(mod, id) {
      const rec = appData[mod].records.find(r => r.id === id);
      if (!rec) return;
      rec.forgetCount = (Number(rec.forgetCount) || 1) + 1;
      rec.dateStr = isoToSlash(todayISO());
      if (!Array.isArray(rec.forgetEvents)) rec.forgetEvents = [];
      rec.forgetEvents.push(Date.now());
      if (rec.status === '已掌握') rec.status = '复习中';
      await persistData(true);
      renderRecords(mod, id);
      showToast(`「${rec.topic}」遗忘次数 +1（当前 ${rec.forgetCount} 次）`, 'info');
    }


    // 修改记录状态（待解决/复习中/已掌握）
    async function changeRecordStatus(mod, id, newStatus) {
      const rec = appData[mod].records.find(r => r.id === id);
      if (!rec) return;
      rec.status = newStatus;
      await persistData(true);
      renderRecords(mod);
    }


    // 删除一条薄弱点记录（删除前自动建快照，可找回）
    async function deleteRecord(mod, id) {
      const rec = appData[mod].records.find(r => r.id === id);
      if (!rec) return;
      const ok = await showConfirm({
        title: '删除薄弱点记录',
        message: `确定要删除「${rec.topic}」吗？删除前系统会自动在历史快照中留存备份。`,
        okText: '确认删除',
        danger: true
      });
      if (!ok) return;

      await createSnapshot(`删除薄弱点前备份`);
      appData[mod].records = appData[mod].records.filter(r => r.id !== id);
      await persistData(true);
      renderRecords(mod);
      showToast('已删除记录（可通过历史快照恢复）', 'info');
    }


    // 把一条薄弱点记录推送到每日待办
    async function pushRecordToTodo(mod, id) {
      const rec = appData[mod].records.find(r => r.id === id);
      if (!rec) return;
      const cat = mod === 'math' ? '数学' : '408';
      appData.todos.push({
        id: genId('todo'),
        dateStr: todayISO(),
        title: `复习【${rec.subject}】${rec.topic}`,
        category: cat,
        priority: (rec.forgetCount || 1) >= 3 ? '高' : '中',
        completed: false,
        note: rec.note || `来源：${rec.source || '薄弱点追踪'}`,
        createdAt: Date.now()
      });
      await persistData(true);
      renderTodos();
      showToast(`已将「${rec.topic}」加入今日待办`, 'success');
    }


    // 打开“新增/编辑薄弱点”弹窗并回填字段
    function openRecordModal(mod, id = '') {
      document.getElementById('rec-module').value = mod;
      document.getElementById('rec-id').value = id;
      recNoteSwitchTab('split'); // 每次打开备注编辑器都回到「分屏实时渲染」

      const subSel = document.getElementById('rec-subject');
      subSel.innerHTML = appData[mod].subjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

      if (id) {
        const rec = appData[mod].records.find(r => r.id === id);
        document.getElementById('recordModalTitle').textContent = '✏️ 编辑薄弱点';
        subSel.value = rec.subject;
        document.getElementById('rec-type').value = rec.type || '知识缺失';
        document.getElementById('rec-topic').value = rec.topic || '';
        document.getElementById('rec-source').value = rec.source || '';
        document.getElementById('rec-status').value = rec.status || '待解决';
        document.getElementById('rec-forgetCount').value = rec.forgetCount || 1;
        document.getElementById('rec-date').value = slashToIso(rec.dateStr);
        document.getElementById('rec-note').value = rec.note || '';
        document.getElementById('rec-forget-history').innerHTML = forgetHistoryHtml(rec);
        document.getElementById('rec-forget-history-wrap').classList.remove('hidden');
      } else {
        document.getElementById('recordModalTitle').textContent = mod === 'math' ? '📐 新增考研数学薄弱点' : '💻 新增408薄弱点';
        document.getElementById('rec-type').value = '知识缺失';
        document.getElementById('rec-topic').value = '';
        document.getElementById('rec-source').value = '';
        document.getElementById('rec-status').value = '待解决';
        document.getElementById('rec-forgetCount').value = '1';
        document.getElementById('rec-date').value = todayISO();
        document.getElementById('rec-note').value = '';
        document.getElementById('rec-forget-history-wrap').classList.add('hidden');
      }
      document.getElementById('recordModal').classList.add('open');
      setTimeout(() => document.getElementById('rec-topic').focus(), 100);
    }


    // 关闭薄弱点编辑弹窗
    function closeRecordModal() {
      document.getElementById('recordModal').classList.remove('open');
    }


    // 保存薄弱点编辑弹窗的表单数据（新增或更新）
    async function saveRecordModal() {
      const mod = document.getElementById('rec-module').value;
      const id = document.getElementById('rec-id').value;
      const topic = document.getElementById('rec-topic').value.trim();
      if (!topic) {
        showToast('请填写知识点或题目名称', 'warning');
        return;
      }

      const dateSlash = isoToSlash(document.getElementById('rec-date').value || todayISO());
      const forgetCount = Math.max(1, parseInt(document.getElementById('rec-forgetCount').value, 10) || 1);

      if (id) {
        const rec = appData[mod].records.find(r => r.id === id);
        if (rec) {
          rec.subject = document.getElementById('rec-subject').value;
          rec.type = document.getElementById('rec-type').value;
          rec.topic = topic;
          rec.source = document.getElementById('rec-source').value.trim();
          rec.status = document.getElementById('rec-status').value;
          rec.forgetCount = forgetCount;
          rec.dateStr = dateSlash;
          rec.note = document.getElementById('rec-note').value.trim();
          if (!Array.isArray(rec.forgetEvents)) rec.forgetEvents = [];
        }
      } else {
        appData[mod].records.unshift({
          id: genId(mod),
          subject: document.getElementById('rec-subject').value,
          topic,
          type: document.getElementById('rec-type').value,
          source: document.getElementById('rec-source').value.trim(),
          status: document.getElementById('rec-status').value,
          note: document.getElementById('rec-note').value.trim(),
          forgetCount,
          forgetEvents: [dateStrToTs(dateSlash)],
          firstDateStr: dateSlash,
          dateStr: dateSlash,
          createdAt: Date.now()
        });
      }

      closeRecordModal();
      await persistData(true);
      renderRecords(mod);
      showToast(id ? '已更新薄弱点记录' : '已添加新的薄弱点', 'success');
    }

    // =========================================================================
    // 8. 每日待办模块（按日期分组、进度条、顺延）
    // =========================================================================
    function toggleTodoDateSort() {
      todoDateSortOrder = todoDateSortOrder === 'desc' ? 'asc' : 'desc';
      document.getElementById('todo-sort-btn').textContent = todoDateSortOrder === 'desc'
        ? '📅 按日期降序（最新在前）↓'
        : '📅 按日期升序（最早在前）↑';
      renderTodos();
    }


    // 清空待办页的所有筛选条件
    function clearTodoFilters() {
      document.getElementById('filter-todo-status').value = 'all';
      document.getElementById('filter-todo-cat').value = '';
      document.getElementById('filter-todo-date').value = '';
      document.getElementById('search-todo').value = '';
      renderTodos();
    }


    // 快速添加一条待办（来自顶部输入栏）
    async function quickAddTodo() {
      const titleEl = document.getElementById('quick-todo-title');
      const title = titleEl.value.trim();
      if (!title) {
        showToast('请输入待办事项内容', 'warning');
        titleEl.focus();
        return;
      }

      appData.todos.push({
        id: genId('todo'),
        dateStr: document.getElementById('quick-todo-date').value || todayISO(),
        title,
        category: document.getElementById('quick-todo-cat').value,
        priority: document.getElementById('quick-todo-priority').value,
        completed: false,
        note: document.getElementById('quick-todo-note').value.trim(),
        createdAt: Date.now()
      });

      titleEl.value = '';
      document.getElementById('quick-todo-note').value = '';
      await persistData(true);
      renderTodos();
      showToast('已添加待办事项', 'success');
    }


    // 切换某条待办的完成状态
    async function toggleTodoComplete(id) {
      const todo = appData.todos.find(t => t.id === id);
      if (!todo) return;
      todo.completed = !todo.completed;
      await persistData(true);
      renderTodos(id);
    }


    // 顺延待办：在自身日期上加一天
    async function postponeTodoToTomorrow(id) {
      const todo = appData.todos.find(t => t.id === id);
      if (!todo) return;
      // 直接在待办自身日期上加一天：22 号没完成顺延到 23 号，而不是今天(23)的明天
      todo.dateStr = addDaysISO(todo.dateStr, 1);
      await persistData(true);
      renderTodos();
      showToast(`已顺延至 ${isoToSlash(todo.dateStr)}`, 'info');
    }


    // 删除一条待办
    async function deleteTodo(id) {
      await createSnapshot('删除待办前备份');
      appData.todos = appData.todos.filter(t => t.id !== id);
      await persistData(true);
      renderTodos();
      showToast('已删除待办（可在历史快照中找回）', 'info');
    }


    // 打开待办编辑弹窗并回填字段
    function openTodoModal(id) {
      const todo = appData.todos.find(t => t.id === id);
      if (!todo) return;
      document.getElementById('edit-todo-id').value = todo.id;
      document.getElementById('edit-todo-date').value = slashToIso(todo.dateStr);
      document.getElementById('edit-todo-cat').value = todo.category || '综合';
      document.getElementById('edit-todo-title').value = todo.title || '';
      document.getElementById('edit-todo-priority').value = todo.priority || '中';
      document.getElementById('edit-todo-completed').value = String(Boolean(todo.completed));
      document.getElementById('edit-todo-note').value = todo.note || '';
      document.getElementById('todoModal').classList.add('open');
    }


    // 关闭待办编辑弹窗
    function closeTodoModal() {
      document.getElementById('todoModal').classList.remove('open');
    }


    // 保存待办编辑弹窗的修改
    async function saveTodoModal() {
      const id = document.getElementById('edit-todo-id').value;
      const title = document.getElementById('edit-todo-title').value.trim();
      if (!title) {
        showToast('待办内容不能为空', 'warning');
        return;
      }
      const todo = appData.todos.find(t => t.id === id);
      if (todo) {
        todo.dateStr = document.getElementById('edit-todo-date').value || todayISO();
        todo.category = document.getElementById('edit-todo-cat').value;
        todo.title = title;
        todo.priority = document.getElementById('edit-todo-priority').value;
        todo.completed = document.getElementById('edit-todo-completed').value === 'true';
        todo.note = document.getElementById('edit-todo-note').value.trim();
      }
      closeTodoModal();
      await persistData(true);
      renderTodos();
      showToast('已保存待办修改', 'success');
    }


    // 渲染待办页顶部四个统计卡片
    function renderTodoStats() {
      const today = todayISO();
      const all = appData.todos;
      const todayList = all.filter(t => t.dateStr === today);
      const todayDone = todayList.filter(t => t.completed).length;
      const pendingAll = all.filter(t => !t.completed).length;
      const overdue = all.filter(t => !t.completed && t.dateStr < today).length;
      const doneAll = all.filter(t => t.completed).length;

      const cards = [
        { label: '今日待办进度', value: `${todayDone} / ${todayList.length}`, color: 'text-blue-600', bg: 'bg-blue-50', icon: '🎯' },
        { label: '全部未完成', value: pendingAll, color: 'text-amber-600', bg: 'bg-amber-50', icon: '📝' },
        { label: '已逾期未完成', value: overdue, color: 'text-rose-600', bg: 'bg-rose-50', icon: '⏰' },
        { label: '累计已完成', value: doneAll, color: 'text-emerald-600', bg: 'bg-emerald-50', icon: '🏆' }
      ];

      document.getElementById('stats-todo').innerHTML = cards.map((c, i) => `
        <div class="stat-card bg-white/95 backdrop-blur border border-slate-200/80 rounded-2xl p-4 sm:p-5 shadow-sm flex items-center justify-between" style="--stagger:${i}">
          <div>
            <div class="text-xs font-medium text-slate-500 mb-1">${c.label}</div>
            <div class="text-2xl sm:text-3xl font-extrabold ${c.color} tracking-tight">${c.value}</div>
          </div>
          <div class="w-11 h-11 rounded-2xl ${c.bg} flex items-center justify-center text-xl">${c.icon}</div>
        </div>
      `).join('');
    }

    // 月度待办热力图：每格 = 一天，颜色深浅表示当天待办数量
    function shiftHeatmapMonth(delta) {
      const base = heatmapYM || todayISO().slice(0, 7);
      const [y, m] = base.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      heatmapYM = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      renderTodoHeatmap();
    }


    // 渲染月度待办热力图：按日期统计待办数量，颜色深浅表示忙闲
    function renderTodoHeatmap() {
      const el = document.getElementById('todo-heatmap');
      if (!el) return;
      const ym = heatmapYM || todayISO().slice(0, 7);
      const [year, month] = ym.split('-').map(Number);
      const firstDay = new Date(year, month - 1, 1);
      const daysInMonth = new Date(year, month, 0).getDate();
      const startWeekday = (firstDay.getDay() + 6) % 7; // 周一=0 ... 周日=6
      const weekNames = ['一', '二', '三', '四', '五', '六', '日'];
      const today = todayISO();

      // 按日期统计待办数量（含已完成/未完成）
      const counts = {};
      appData.todos.forEach(t => {
        const iso = slashToIso(t.dateStr || today);
        counts[iso] = (counts[iso] || 0) + 1;
      });

      // 颜色分档：0 浅灰 → 1~2 → 3~4 → 5~6 → 7+ 深蓝
      const levelOf = n => n === 0 ? 0 : n <= 2 ? 1 : n <= 4 ? 2 : n <= 6 ? 3 : 4;
      const cellColors = [
        'bg-slate-100/80 border-slate-200/70 text-slate-400',
        'bg-blue-100 border-blue-200 text-blue-700',
        'bg-blue-200 border-blue-300 text-blue-800',
        'bg-blue-400 border-blue-500 text-white',
        'bg-blue-600 border-blue-700 text-white'
      ];

      // 先汇总整月统计，再生成格子（避免 tooltip 里的“最多一天”标记错位）
      let monthTotal = 0, activeDays = 0, maxCount = 0, maxDay = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const n = counts[`${ym}-${String(d).padStart(2, '0')}`] || 0;
        monthTotal += n;
        if (n > 0) activeDays++;
        if (n > maxCount) { maxCount = n; maxDay = d; }
      }

      const cells = [];
      for (let i = 0; i < startWeekday; i++) cells.push('<div></div>'); // 月初占位
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${ym}-${String(d).padStart(2, '0')}`;
        const n = counts[iso] || 0;
        const lv = levelOf(n);
        const isToday = iso === today;
        const dow = (startWeekday + d - 1) % 7;
        cells.push(`
          <div class="relative aspect-square rounded-lg border flex flex-col items-center justify-center cursor-default transition-transform hover:scale-110 hover:z-10 shadow-xs ${cellColors[lv]} ${dow >= 5 ? 'opacity-90' : ''} ${isToday ? 'ring-2 ring-blue-500 ring-offset-1' : ''}"
            title="${month}月${d}日：${n} 条待办${n > 0 && d === maxDay ? ' · 本月最多' : ''}">
            <span class="text-xs sm:text-sm font-semibold leading-none">${d}</span>
            ${n ? `<span class="text-[9px] sm:text-[10px] font-bold leading-none mt-1">${n}条</span>` : ''}
          </div>`);
      }

      const isCurrentMonth = ym === today.slice(0, 7);
      el.innerHTML = `
        <div class="bg-white/95 backdrop-blur border border-slate-200/80 rounded-2xl p-4 sm:p-5 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div>
              <h3 class="text-sm sm:text-base font-bold text-slate-800">🗓️ 待办热力图 <span class="text-xs font-normal text-slate-400">· 格子颜色越深，当天待办越多</span></h3>
              <p class="text-[11px] text-slate-500 mt-0.5">本月共 <b class="text-blue-600">${monthTotal}</b> 条 · 有安排 <b class="text-emerald-600">${activeDays}</b> 天${maxCount ? ` · 最多 ${month}月${maxDay}日（${maxCount} 条）` : ''}</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="shiftHeatmapMonth(-1)" class="btn-tactile w-8 h-8 rounded-lg flex items-center justify-center bg-slate-100 text-slate-600 hover:bg-slate-200" title="上个月">‹</button>
              <span class="min-w-[92px] text-center text-sm font-bold text-slate-700 tabular-nums">${year}年${month}月</span>
              <button onclick="shiftHeatmapMonth(1)" class="btn-tactile w-8 h-8 rounded-lg flex items-center justify-center bg-slate-100 text-slate-600 hover:bg-slate-200 ${isCurrentMonth ? 'opacity-40' : ''}" title="下个月">›</button>
              ${!isCurrentMonth ? `<button onclick="heatmapYM='';renderTodoHeatmap()" class="btn-tactile px-2.5 h-8 rounded-lg text-xs font-semibold bg-blue-50 text-blue-700 hover:bg-blue-100">回到本月</button>` : ''}
            </div>
          </div>
          <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
            ${weekNames.map(w => `<div class="text-center text-[11px] font-semibold text-slate-400 pb-1">${w}</div>`).join('')}
            ${cells.join('')}
          </div>
          <div class="flex items-center justify-end gap-1.5 mt-3 text-[11px] text-slate-400">
            <span>少</span>
            ${cellColors.map(c => `<span class="w-3.5 h-3.5 rounded border ${c}"></span>`).join('')}
            <span>多</span>
          </div>
        </div>`;
    }


    // 渲染待办页：统计卡 + 热力图 + 按日期分组的待办列表
    function renderTodos(popTodoId = null) {
      renderTodoStats();
      renderTodoHeatmap();
      const statusFilter = document.getElementById('filter-todo-status').value;
      const catFilter = document.getElementById('filter-todo-cat').value;
      const dateFilter = document.getElementById('filter-todo-date').value;
      const kw = document.getElementById('search-todo').value.trim().toLowerCase();

      let list = [...appData.todos];
      if (statusFilter === 'pending') list = list.filter(t => !t.completed);
      if (statusFilter === 'done') list = list.filter(t => t.completed);
      if (catFilter) list = list.filter(t => t.category === catFilter);
      if (dateFilter) list = list.filter(t => t.dateStr === dateFilter);
      if (kw) {
        list = list.filter(t =>
          (t.title || '').toLowerCase().includes(kw) ||
          (t.note || '').toLowerCase().includes(kw) ||
          (t.category || '').toLowerCase().includes(kw)
        );
      }

      const container = document.getElementById('todo-groups-container');
      if (!list.length) {
        container.innerHTML = `
          <div class="bg-white/95 border border-slate-200/80 rounded-2xl p-14 text-center shadow-sm">
            <div class="text-4xl mb-3">🗓️</div>
            <div class="text-slate-600 font-semibold mb-1">暂无待办事项</div>
            <div class="text-xs text-slate-400">在上方快速添加今天的考研复习计划，或从数学/408薄弱点一键加入待办 ✨</div>
          </div>`;
        return;
      }

      const groupsMap = {};
      list.forEach(t => {
        const d = slashToIso(t.dateStr);
        if (!groupsMap[d]) groupsMap[d] = [];
        groupsMap[d].push(t);
      });

      const sortedDates = Object.keys(groupsMap).sort((a, b) =>
        todoDateSortOrder === 'desc' ? b.localeCompare(a) : a.localeCompare(b)
      );

      const today = todayISO();
      const tomorrow = addDaysISO(today, 1);
      const priorityRank = { '高': 1, '中': 2, '低': 3 };

      const catStyles = {
        '数学': 'bg-blue-50 text-blue-700',
        '408': 'bg-violet-50 text-violet-700',
        '英语': 'bg-cyan-50 text-cyan-700',
        '政治': 'bg-rose-50 text-rose-700',
        '综合': 'bg-slate-100 text-slate-600'
      };

      const prioStyles = {
        '高': 'bg-rose-50 text-rose-600 border border-rose-200/70',
        '中': 'bg-amber-50 text-amber-700 border border-amber-200/70',
        '低': 'bg-slate-100 text-slate-500 border border-slate-200/70'
      };

      container.innerHTML = sortedDates.map((dateIso, gIdx) => {
        const items = groupsMap[dateIso].sort((a, b) => {
          if (a.completed !== b.completed) return a.completed ? 1 : -1;
          const pDiff = (priorityRank[a.priority] || 2) - (priorityRank[b.priority] || 2);
          if (pDiff !== 0) return pDiff;
          return (a.createdAt || 0) - (b.createdAt || 0);
        });

        const doneCount = items.filter(i => i.completed).length;
        const pct = Math.round((doneCount / items.length) * 100);
        const hasPending = doneCount < items.length;

        let tagHtml = '';
        if (dateIso === today) {
          tagHtml = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-600 text-white">今天</span>`;
        } else if (dateIso === tomorrow) {
          tagHtml = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-violet-100 text-violet-700">明天</span>`;
        } else if (dateIso < today && hasPending) {
          tagHtml = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">有未完成</span>`;
        } else if (dateIso < today) {
          tagHtml = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">已归档</span>`;
        } else {
          tagHtml = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-sky-100 text-sky-700">计划中</span>`;
        }

        const itemsHtml = items.map(t => {
          const popClass = popTodoId === t.id ? 'animate-pop' : '';
          return `
            <li class="flex flex-wrap sm:flex-nowrap items-start justify-between gap-3 px-5 py-4 border-b border-slate-100 last:border-b-0 transition-all ${t.completed ? 'bg-slate-50/60 opacity-75' : 'hover:bg-blue-50/25'}">
              <div class="flex items-start gap-3.5 flex-1 min-w-0">
                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodoComplete('${t.id}')"
                  class="mt-1 w-5 h-5 rounded-md accent-blue-600 cursor-pointer flex-shrink-0 ${popClass}" />
                <div class="flex-1 min-w-0">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold ${catStyles[t.category] || catStyles['综合']}">${escapeHtml(t.category || '综合')}</span>
                    <span class="px-2 py-0.5 rounded-lg text-[11px] font-semibold ${prioStyles[t.priority] || prioStyles['中']}">${escapeHtml(t.priority || '中')}优</span>
                    <span class="text-[15px] font-semibold break-words ${t.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${escapeHtml(t.title)}</span>
                  </div>
                  ${t.note ? `<div class="text-xs text-slate-500 mt-1.5 break-words">${escapeHtml(t.note)}</div>` : ''}
                </div>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0 ml-8 sm:ml-0">
                ${!t.completed ? `<button onclick="postponeTodoToTomorrow('${t.id}')" class="btn-tactile px-2.5 py-1.5 rounded-lg text-xs font-medium bg-amber-50 text-amber-700 hover:bg-amber-100" title="顺延到下一天">顺延</button>` : ''}
                <button onclick="openTodoModal('${t.id}')" class="btn-tactile px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200">编辑</button>
                <button onclick="deleteTodo('${t.id}')" class="btn-tactile px-2.5 py-1.5 rounded-lg text-xs font-medium bg-rose-50 text-rose-600 hover:bg-rose-100">删除</button>
              </div>
            </li>
          `;
        }).join('');

        return `
          <div class="todo-date-group bg-white/95 backdrop-blur border border-slate-200/90 rounded-2xl shadow-sm overflow-hidden" style="--stagger:${gIdx}">
            <div class="px-5 py-3.5 bg-slate-50/80 border-b border-slate-200/80 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                <span class="text-base font-bold text-slate-800">📅 ${isoToSlash(dateIso)}</span>
                <span class="text-sm font-medium text-slate-500">${getWeekday(dateIso)}</span>
                ${tagHtml}
              </div>
              <div class="flex items-center gap-3 text-xs font-medium text-slate-500">
                <span>已完成 <b class="text-slate-800">${doneCount}</b> / ${items.length}</span>
                <div class="w-24 h-2 bg-slate-200 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full transition-all duration-300" style="width:${pct}%"></div>
                </div>
              </div>
            </div>
            <ul>${itemsHtml}</ul>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // 8.5 套卷模块（408 / 数学：小题大题分数 + 错误题一键加入遗忘点）
    // =========================================================================
    function paperTotal(p) {
      return (p.smallScore || 0) + (p.bigScore || 0);
    }


    // 根据现有套卷的分类动态填充“系列”筛选下拉框
    function populatePaperCatFilter() {
      const sel = document.getElementById('filter-paper-cat');
      const prev = sel.value;
      const cats = [...new Set(appData.papers.map(p => p.category).filter(Boolean))].sort();
      sel.innerHTML = '<option value="">全部系列</option>' +
        cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      if (cats.includes(prev)) sel.value = prev;
    }


    // 渲染套卷页顶部四个统计卡片
    function renderPaperStats() {
      const list = appData.papers;
      const mathCount = list.filter(p => p.mod === 'math').length;
      const csCount = list.filter(p => p.mod === '408').length;
      const errTotal = list.reduce((a, p) => a + (p.errors ? p.errors.length : 0), 0);
      const cards = [
        { label: '总套卷数', value: list.length, color: 'text-emerald-600', bg: 'bg-emerald-50', icon: '📝' },
        { label: '数学套卷', value: mathCount, color: 'text-blue-600', bg: 'bg-blue-50', icon: '📐' },
        { label: '408 套卷', value: csCount, color: 'text-violet-600', bg: 'bg-violet-50', icon: '💻' },
        { label: '错误题总数', value: errTotal, color: 'text-rose-600', bg: 'bg-rose-50', icon: '❌' }
      ];
      document.getElementById('stats-paper').innerHTML = cards.map((c, i) => `
        <div class="stat-card bg-white/95 backdrop-blur border border-slate-200/80 rounded-2xl p-4 sm:p-5 shadow-sm flex items-center justify-between" style="--stagger:${i}">
          <div>
            <div class="text-xs font-medium text-slate-500 mb-1">${c.label}</div>
            <div class="text-2xl sm:text-3xl font-extrabold ${c.color} tracking-tight">${c.value}</div>
          </div>
          <div class="w-11 h-11 rounded-2xl ${c.bg} flex items-center justify-center text-xl">${c.icon}</div>
        </div>
      `).join('');
    }

    // 平均分统计图表：数学/408 × 真题/模拟卷，柱形展示各套分数与平均分
        // 渲染平均分图表：数学/408 × 真题/模拟卷分组，柱形显示各卷得分与均分线
    function renderScoreChart() {
      const el = document.getElementById('score-chart');
      if (!el) return;
      const groups = [
        { mod: 'math', cat: '真题', label: '数学 · 真题', icon: '📐', tone: 'blue' },
        { mod: 'math', cat: '模拟卷', label: '数学 · 模拟卷', icon: '📘', tone: 'cyan' },
        { mod: '408', cat: '真题', label: '408 · 真题', icon: '💻', tone: 'violet' },
        { mod: '408', cat: '模拟卷', label: '408 · 模拟卷', icon: '🧪', tone: 'purple' }
      ];
      const theme = {
        blue:   { bar: 'bg-blue-500',   avg: 'bg-blue-600',   text: 'text-blue-600',   badge: 'bg-blue-50 text-blue-700',   line: 'border-blue-400' },
        cyan:   { bar: 'bg-cyan-500',   avg: 'bg-cyan-600',   text: 'text-cyan-600',   badge: 'bg-cyan-50 text-cyan-700',   line: 'border-cyan-400' },
        violet: { bar: 'bg-violet-500', avg: 'bg-violet-600', text: 'text-violet-600', badge: 'bg-violet-50 text-violet-700', line: 'border-violet-400' },
        purple: { bar: 'bg-purple-500', avg: 'bg-purple-600', text: 'text-purple-600', badge: 'bg-purple-50 text-purple-700', line: 'border-purple-400' }
      };
      const scored = p => p.smallScore !== null || p.bigScore !== null; // 仅统计填了分数的卷
      const MAX = 150; // 数学 / 408 满分均为 150

      const panels = groups.map(g => {
        const t = theme[g.tone];
        const list = appData.papers
          .filter(p => p.mod === g.mod && p.category === g.cat && scored(p))
          .sort((a, b) => slashToIso(a.dateStr).localeCompare(slashToIso(b.dateStr)));
        const scores = list.map(paperTotal);
        const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
        const avgPct = Math.max(0, Math.min(100, avg / MAX * 100));
        const hi = scores.length ? Math.max(...scores) : 0;
        const lo = scores.length ? Math.min(...scores) : 0;
        // 每套卷一根细柱 + 平均分横向虚线
        const bars = scores.map(s => `
          <div class="relative flex-1 h-full flex items-end justify-center group" title="${escapeHtml(list[scores.indexOf(s)].name)}：${s} 分（${escapeHtml(list[scores.indexOf(s)].dateStr)}）">
            <div class="w-full max-w-[14px] rounded-t-md ${t.bar} opacity-60 group-hover:opacity-100 transition-opacity" style="height:${Math.max(2, Math.min(100, s / MAX * 100))}%"></div>
          </div>`).join('');
        return `
          <div class="bg-white/95 backdrop-blur border border-slate-200/80 rounded-2xl p-4 sm:p-5 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="text-lg">${g.icon}</span>
                <span class="text-sm font-bold text-slate-800">${g.label}</span>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${t.badge}">${list.length} 套</span>
            </div>
            <div class="flex items-end gap-2 mb-3">
              <span class="text-3xl font-extrabold ${t.text} tabular-nums leading-none">${scores.length ? avg.toFixed(1) : '—'}</span>
              <span class="text-xs text-slate-400 mb-0.5">平均分</span>
              ${scores.length ? `<span class="ml-auto text-[11px] text-slate-400 mb-0.5">最高 ${hi} · 最低 ${lo}</span>` : ''}
            </div>
            <div class="relative h-28 bg-slate-50/90 border border-slate-100 rounded-xl overflow-hidden px-2 pt-2">
              <!-- 满分参考网格线 -->
              <div class="absolute inset-x-0 bottom-1/3 border-t border-dashed border-slate-200"></div>
              <div class="absolute inset-x-0 bottom-[66.6%] border-t border-dashed border-slate-200"></div>
              <div class="flex items-end gap-1 h-full">
                ${scores.length ? bars : '<div class="w-full self-center text-center text-xs text-slate-400 py-8">暂无带分数的套卷</div>'}
              </div>
              ${scores.length ? `<div class="absolute inset-x-2 border-t-2 border-dashed ${t.line} pointer-events-none" style="bottom:calc(8px + (100% - 8px) * ${avgPct / 100})">
                <span class="absolute -top-4 right-0 text-[10px] font-bold ${t.text}">均分线</span>
              </div>` : ''}
            </div>
            <div class="flex items-center justify-between mt-2 text-[10px] text-slate-400">
              <span>满分 ${MAX}</span><span>按考试日期排列 →</span>
            </div>
          </div>`;
      }).join('');

      el.innerHTML = `
        <div class="bg-white/60 backdrop-blur border border-slate-200/70 rounded-2xl p-4 sm:p-5 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h3 class="text-sm sm:text-base font-bold text-slate-800">📊 套卷平均分概览</h3>
              <p class="text-[11px] text-slate-500 mt-0.5">真题与模拟卷分开统计 · 柱形为每次得分，虚线为平均分（满分 150）</p>
            </div>
            <span class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-500">共 ${appData.papers.length} 套记录</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3.5">${panels}</div>
        </div>`;
    }


    // 按科目/分类/关键词筛选并排序套卷
    function getFilteredPapers() {
      const modVal = document.getElementById('filter-paper-mod').value;
      const catVal = document.getElementById('filter-paper-cat').value;
      const sortVal = document.getElementById('sort-paper').value;
      const kw = document.getElementById('search-paper').value.trim().toLowerCase();

      let list = [...appData.papers];
      if (modVal) list = list.filter(p => p.mod === modVal);
      if (catVal) list = list.filter(p => p.category === catVal);
      if (kw) {
        list = list.filter(p =>
          (p.name || '').toLowerCase().includes(kw) ||
          (p.category || '').toLowerCase().includes(kw) ||
          (p.note || '').toLowerCase().includes(kw) ||
          (p.errors || []).some(e => (e.point || '').toLowerCase().includes(kw) || (e.qno || '').toLowerCase().includes(kw))
        );
      }
      list.sort((a, b) => {
        if (sortVal === 'scoreDesc') return paperTotal(b) - paperTotal(a) || slashToIso(b.dateStr).localeCompare(slashToIso(a.dateStr));
        if (sortVal === 'scoreAsc') return paperTotal(a) - paperTotal(b) || slashToIso(b.dateStr).localeCompare(slashToIso(a.dateStr));
        return slashToIso(b.dateStr).localeCompare(slashToIso(a.dateStr)) || (b.createdAt || 0) - (a.createdAt || 0);
      });
      return list;
    }


    // 生成单张套卷卡片的 HTML（分数/用时/错误题列表）
    function paperCardHtml(p, idx) {
      const modBadge = p.mod === 'math'
        ? 'bg-blue-50 text-blue-700 border-blue-100'
        : 'bg-violet-50 text-violet-700 border-violet-100';
      const modLabel = p.mod === 'math' ? '📐 数学' : '💻 408';
      const fmt = v => (v === null || v === undefined) ? '—' : v;
      const hasScore = p.smallScore !== null || p.bigScore !== null;
      const total = hasScore ? paperTotal(p) : '—';
      const time = p.timeUsed === null ? '—' : `${p.timeUsed}′`;
      const errors = p.errors || [];

      const scoreCell = (label, val, cls) => `
        <div class="bg-slate-50/80 border border-slate-200/70 rounded-xl px-2 py-2.5 text-center">
          <div class="text-[11px] text-slate-500 mb-0.5">${label}</div>
          <div class="text-lg font-extrabold ${cls} tabular-nums leading-none">${val}</div>
        </div>`;

      const errorsHtml = errors.length ? errors.map(e => `
        <div class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200/70 bg-slate-50/60">
          <span class="shrink-0 px-2 py-0.5 rounded-md bg-white border border-slate-200 text-xs font-bold text-slate-700">${e.qno ? '题 ' + escapeHtml(e.qno) : '—'}</span>
          ${e.sub ? `<span class="shrink-0 px-2 py-0.5 rounded-md bg-violet-50 text-violet-700 text-[11px] font-medium">${escapeHtml(e.sub)}</span>` : ''}
          <span class="flex-1 text-sm text-slate-700 break-words">${e.point ? escapeHtml(e.point) : '<span class="text-slate-400 italic">未填写错误点</span>'}</span>
          ${e.addedToTracker
            ? '<span class="shrink-0 text-xs font-semibold text-emerald-600">✓ 已加入</span>'
            : `<button onclick="pushErrorToTracker('${p.id}','${e.id}')" class="shrink-0 btn-tactile px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-xs">＋ 遗忘点</button>`}
        </div>`).join('')
        : '<div class="text-xs text-slate-400 italic px-1">暂无错误题，点击 ✏️ 编辑添加</div>';

      return `
        <article class="bg-white/95 backdrop-blur border border-slate-200/80 rounded-2xl shadow-sm p-5 flex flex-col gap-3.5" style="--stagger:${idx}">
          <div class="flex items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${modBadge}">${modLabel}</span>
              ${p.category ? `<span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-indigo-50/70 text-indigo-600">📌 ${escapeHtml(p.category)}</span>` : ''}
              <span class="text-xs text-slate-400">📅 ${escapeHtml(p.dateStr)}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="openPaperModal('${p.id}')" title="编辑" class="btn-tactile w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-blue-600">✏️</button>
              <button onclick="deletePaper('${p.id}')" title="删除" class="btn-tactile w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-rose-50 hover:text-rose-600">🗑️</button>
            </div>
          </div>

          <h3 class="text-[19px] font-bold text-slate-900 leading-[1.4] tracking-tight break-words">${escapeHtml(p.name)}</h3>

          <div class="grid grid-cols-4 gap-2">
            ${scoreCell('小题', fmt(p.smallScore), 'text-slate-800')}
            ${scoreCell('大题', fmt(p.bigScore), 'text-slate-800')}
            ${scoreCell('总分', total, 'text-emerald-600')}
            ${scoreCell('用时', time, 'text-blue-600')}
          </div>

          ${p.note ? `<div class="bg-slate-50/90 border border-slate-200/70 rounded-xl px-3.5 py-3 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(p.note)}</div>` : ''}

          <div>
            <div class="text-xs font-semibold text-slate-500 mb-1.5">错误题（${errors.length}）</div>
            <div class="space-y-1.5">${errorsHtml}</div>
          </div>
        </article>`;
    }


    // 渲染套卷页：统计卡 + 平均分图表 + 筛选后的套卷列表
    function renderPapers() {
      populatePaperCatFilter();
      renderPaperStats();
      renderScoreChart();
      const list = getFilteredPapers();
      const container = document.getElementById('papers-container');
      if (!list.length) {
        container.innerHTML = `
          <div class="bg-white/95 border border-slate-200/80 rounded-2xl p-14 text-center shadow-sm">
            <div class="text-4xl mb-3">📭</div>
            <div class="text-slate-600 font-semibold mb-1">暂无套卷记录</div>
            <div class="text-xs text-slate-400">点击右上角“新增套卷”，记录小题/大题分数与错误题</div>
          </div>`;
        return;
      }
      container.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">${list.map((p, idx) => paperCardHtml(p, idx)).join('')}</div>`;
    }


    // 打开“新增/编辑套卷”弹窗
    function openPaperModal(id = '') {
      document.getElementById('paper-id').value = id;
      const modSel = document.getElementById('paper-mod');
      if (id) {
        const p = appData.papers.find(x => x.id === id);
        if (!p) return;
        document.getElementById('paperModalTitle').textContent = '✏️ 编辑套卷';
        modSel.value = p.mod;
        document.getElementById('paper-name').value = p.name || '';
        document.getElementById('paper-category').value = p.category || '';
        document.getElementById('paper-small').value = p.smallScore === null ? '' : p.smallScore;
        document.getElementById('paper-big').value = p.bigScore === null ? '' : p.bigScore;
        document.getElementById('paper-time').value = p.timeUsed === null ? '' : p.timeUsed;
        document.getElementById('paper-date').value = slashToIso(p.dateStr);
        document.getElementById('paper-note').value = p.note || '';
        paperDraftErrors = (p.errors || []).map(e => ({ ...e }));
      } else {
        document.getElementById('paperModalTitle').textContent = '📝 新增套卷';
        modSel.value = '408';
        document.getElementById('paper-name').value = '';
        document.getElementById('paper-category').value = '';
        document.getElementById('paper-small').value = '';
        document.getElementById('paper-big').value = '';
        document.getElementById('paper-time').value = '';
        document.getElementById('paper-date').value = todayISO();
        document.getElementById('paper-note').value = '';
        paperDraftErrors = [];
      }
      renderPaperErrorRows();
      document.getElementById('paperModal').classList.add('open');
      setTimeout(() => document.getElementById('paper-name').focus(), 100);
    }


    // 关闭套卷编辑弹窗
    function closePaperModal() {
      document.getElementById('paperModal').classList.remove('open');
    }


    // 套卷科目切换时的联动处理
    function onPaperModChange() {
      renderPaperErrorRows();
    }


    // 渲染套卷弹窗内的错误题编辑行
    function renderPaperErrorRows() {
      const mod = document.getElementById('paper-mod').value;
      const subjects = appData[mod].subjects;
      const container = document.getElementById('paper-errors-container');
      if (!paperDraftErrors.length) {
        container.innerHTML = '<div class="text-xs text-slate-400 italic px-1 py-2">暂无错误题，点击右上角“添加错误题”记录题号与错误点</div>';
        return;
      }
      container.innerHTML = paperDraftErrors.map(e => {
        const opts = '<option value="">未分科目</option>' +
          subjects.map(s => `<option value="${escapeHtml(s)}" ${e.sub === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('');
        return `
          <div class="flex flex-wrap items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/60">
            <input type="text" value="${escapeHtml(e.qno)}" oninput="updatePaperDraft('${e.id}','qno',this.value)" placeholder="题号"
              class="w-16 px-2 py-1.5 rounded-lg border border-slate-200 text-sm focus:border-blue-500 outline-none" />
            <select onchange="updatePaperDraft('${e.id}','sub',this.value)" class="px-2 py-1.5 rounded-lg border border-slate-200 text-sm focus:border-blue-500 outline-none">${opts}</select>
            <input type="text" value="${escapeHtml(e.point)}" oninput="updatePaperDraft('${e.id}','point',this.value)" placeholder="错误点 / 知识点"
              class="flex-1 min-w-[140px] px-2.5 py-1.5 rounded-lg border border-slate-200 text-sm focus:border-blue-500 outline-none" />
            ${e.addedToTracker ? '<span class="text-xs font-semibold text-emerald-600 shrink-0">✓ 已加入</span>' : ''}
            <button onclick="removePaperErrorRow('${e.id}')" class="btn-tactile shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:bg-rose-50 hover:text-rose-600">✕</button>
          </div>`;
      }).join('');
    }


    // 在套卷弹窗中新增一行错误题输入
    function addPaperErrorRow() {
      paperDraftErrors.push({ id: genId('err'), qno: '', point: '', sub: '', addedToTracker: false });
      renderPaperErrorRows();
    }


    // 删除套卷弹窗中的一行错误题
    function removePaperErrorRow(id) {
      paperDraftErrors = paperDraftErrors.filter(e => e.id !== id);
      renderPaperErrorRows();
    }


    // 更新套卷弹窗草稿中某个字段的值
    function updatePaperDraft(id, field, val) {
      const e = paperDraftErrors.find(x => x.id === id);
      if (e) e[field] = val;
    }


    // 保存套卷弹窗的表单（含错误题）到数据
    async function savePaperModal() {
      const id = document.getElementById('paper-id').value;
      const name = document.getElementById('paper-name').value.trim();
      if (!name) {
        showToast('请填写套卷名称', 'warning');
        return;
      }
      const numOrNull = v => {
        const t = String(v).trim();
        if (t === '') return null;
        const n = Number(t);
        return isNaN(n) ? null : n;
      };
      const data = {
        mod: document.getElementById('paper-mod').value,
        name,
        category: document.getElementById('paper-category').value.trim(),
        smallScore: numOrNull(document.getElementById('paper-small').value),
        bigScore: numOrNull(document.getElementById('paper-big').value),
        timeUsed: numOrNull(document.getElementById('paper-time').value),
        dateStr: isoToSlash(document.getElementById('paper-date').value || todayISO()),
        note: document.getElementById('paper-note').value.trim(),
        errors: paperDraftErrors
          .filter(e => (e.qno || '').trim() || (e.point || '').trim())
          .map(e => ({ id: e.id, qno: (e.qno || '').trim(), point: (e.point || '').trim(), sub: e.sub || '', addedToTracker: Boolean(e.addedToTracker) }))
      };
      if (id) {
        const p = appData.papers.find(x => x.id === id);
        if (p) Object.assign(p, data);
      } else {
        appData.papers.unshift({ id: genId('paper'), ...data, createdAt: Date.now() });
      }
      closePaperModal();
      await persistData(true);
      renderPapers();
      updateTabCounts();
      showToast(id ? '已更新套卷' : '已添加套卷', 'success');
    }


    // 删除一套卷记录
    async function deletePaper(id) {
      const p = appData.papers.find(x => x.id === id);
      if (!p) return;
      const ok = await showConfirm({
        title: '删除套卷',
        message: `确定要删除「${p.name}」吗？其错误题记录会一并删除（已加入遗忘点的记录不受影响）。删除前会自动留存历史快照。`,
        okText: '确认删除',
        danger: true
      });
      if (!ok) return;
      await createSnapshot('删除套卷前备份');
      appData.papers = appData.papers.filter(x => x.id !== id);
      await persistData(true);
      renderPapers();
      updateTabCounts();
      showToast('已删除套卷（可通过历史快照恢复）', 'info');
    }


    // 将套卷中的某道错误题一键加入薄弱点遗忘追踪
    async function pushErrorToTracker(paperId, errId) {
      const paper = appData.papers.find(p => p.id === paperId);
      if (!paper) return;
      const err = (paper.errors || []).find(e => e.id === errId);
      if (!err || err.addedToTracker) return;
      const mod = paper.mod;
      const dateSlash = isoToSlash(todayISO());
      const subject = err.sub || appData[mod].subjects[0];
      const topic = err.point || `第 ${err.qno || '?'} 题`;
      appData[mod].records.unshift({
        id: genId(mod),
        subject,
        topic,
        type: '知识缺失',
        source: paper.category || '',
        status: '待解决',
        note: `来自套卷「${paper.name}」${err.qno ? '第 ' + err.qno + ' 题' : ''}`.trim(),
        forgetCount: 1,
        forgetEvents: [dateStrToTs(dateSlash)],
        firstDateStr: dateSlash,
        dateStr: dateSlash,
        createdAt: Date.now()
      });
      err.addedToTracker = true;
      await persistData(true);
      renderRecords(mod);
      renderPapers();
      updateTabCounts();
      showToast(`已将「${topic}」加入${mod === 'math' ? '数学' : '408'}遗忘点`, 'success');
    }


    // 全量重渲染：四个标签页的记录/统计/图表一次刷新
    function renderAll() {
      populateSubjectFilter('math');
      populateSubjectFilter('408');
      renderRecords('math');
      renderRecords('408');
      renderTodos();
      renderPapers();
      updateTabCounts();
    }

    // =========================================================================
    // 9. 快捷键 (Ctrl+S / Cmd+S) 与离开提醒
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        manualSave();
      }
      if (e.key === 'Escape') {
        closeRecordModal();
        closeTodoModal();
        closePaperModal();
        closeSnapshotModal();
        closeConfirmModal(false);
      }
    });

    window.addEventListener('beforeunload', (e) => {
      if (isDirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // =========================================================================
    // 10. 启动初始化流程
    // =========================================================================
        // 应用启动入口：建库 → 加载数据 → 恢复文件句柄 → 首次全量渲染
    async function initApp() {
      loadPrefs();
      document.getElementById('quick-todo-date').value = todayISO();

      // 1. 打开 IndexedDB
      dbInstance = await openDatabase();

      // 2. 加载数据：优先 IndexedDB -> 其次 v4 localStorage -> 其次 v3 localStorage 迁移 -> 默认数据
      let loaded = await idbGet('state', 'current');
      if (!loaded) {
        try {
          const rawV4 = localStorage.getItem(LS_KEY_V4);
          const rawV3 = localStorage.getItem(LS_KEY_V3);
          if (rawV4) loaded = JSON.parse(rawV4);
          else if (rawV3) loaded = JSON.parse(rawV3);
        } catch {}
      }
      appData = normalizeData(loaded || DEFAULT_DATA);

      // 3. 检查是否记忆了本地 JSON 文件句柄
      const savedHandle = await idbGet('handles', 'jsonFile');
      if (savedHandle && typeof savedHandle.queryPermission === 'function') {
        try {
          const perm = await savedHandle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            fileHandle = savedHandle;
          } else {
            pendingSavedHandle = savedHandle;
          }
        } catch {
          pendingSavedHandle = savedHandle;
        }
      }

      // 4. 初始化样式与渲染
      switchTab('math');
      updateSyncUI();
      await refreshSnapshotCount();
      renderAll();
    }

    initApp();
  </script>
</body>
</html>
