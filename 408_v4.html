<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考研数学与408薄弱点遗忘追踪表 v4 & 每日待办</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <!-- KaTeX 数学公式渲染（CDN，加载失败时降级显示原始 TeX 文本） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="if(window.renderMathAll)window.renderMathAll()"></script>
</head>
<body class="min-h-screen pb-16 selection:bg-blue-100 selection:text-blue-900">

  <!-- ==================== 顶部导航栏（磨砂玻璃） ==================== -->
  <header class="glass-topbar sticky top-0 z-40 border-b border-slate-200/80 shadow-sm">
    <div class="w-full px-4 sm:px-6 py-3 flex flex-wrap xl:flex-nowrap items-center justify-between gap-3">
      <!-- Brand -->
      <div class="flex items-center gap-3 shrink-0">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 text-white flex items-center justify-center font-extrabold text-lg shadow-md shadow-blue-500/25">
          研
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">考研数学与408薄弱点遗忘追踪表</h1>
            <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-indigo-50 text-indigo-600 border border-indigo-100">v4</span>
          </div>
          <p class="text-xs text-slate-500">IndexedDB 主库 + 自动快照 + 本地 JSON 双向同步</p>
        </div>
      </div>

      <!-- 考试倒计时：居中于顶栏空白处（每秒刷新） -->
      <div class="flex-1 flex items-center justify-center">
        <div id="examCountdown" class="hdr-ctrl hdr-countdown" title="距离 2026年12月19日 06:00">
          <span class="cd-icon">⏳</span>
          <span class="cd-num" id="cdDays">--</span><span class="cd-unit">天</span>
          <span class="cd-num" id="cdHours">--</span><span class="cd-unit">时</span>
          <span class="cd-num" id="cdMins">--</span><span class="cd-unit">分</span>
          <span class="cd-num" id="cdSecs">--</span><span class="cd-unit">秒</span>
        </div>
      </div>

      <!-- 存储状态与操作按钮区（统一规格：所有控件等高 40px、同圆角同字号） -->
      <div class="flex flex-wrap xl:flex-nowrap items-center justify-end gap-2 shrink-0">
        <!-- ===== 状态组：同步状态 / 自动写盘 ===== -->
        <div class="flex flex-wrap xl:flex-nowrap items-center justify-end gap-2 min-w-0">
          <span id="syncBadge" class="hdr-ctrl bg-slate-100 text-slate-600 border border-slate-200/80 max-w-[120px]">
            <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-slate-400 shrink-0"></span>
            <span id="syncText" class="truncate">IndexedDB 本地库</span>
          </span>

          <!-- 一键恢复文件句柄权限按钮（刷新后有已保存句柄时出现） -->
          <button id="reconnectBtn" onclick="reconnectLocalJson()" class="hidden hdr-ctrl bg-amber-50 text-amber-700 border border-amber-300 hover:bg-amber-100">
            🔄 恢复同步
          </button>

          <!-- 自动写盘开关（绑定本地JSON后可用） -->
          <label id="autoSyncWrap" class="hidden hdr-ctrl bg-emerald-50 text-emerald-700 border border-emerald-200 cursor-pointer select-none" title="开启后每次修改将自动写入绑定的本地 JSON 文件">
            <input type="checkbox" id="autoSyncToggle" class="accent-emerald-600 w-3.5 h-3.5 rounded cursor-pointer" onchange="toggleAutoSync(this.checked)" />
            <span>自动写盘</span>
          </label>
        </div>

        <!-- ===== 操作组：保存 / 快照 / 数据工具 ===== -->
        <div class="flex flex-wrap xl:flex-nowrap items-center justify-end gap-2 min-w-0">
          <!-- 手动保存主按钮（支持 Ctrl+S） -->
          <button id="manualSaveBtn" onclick="manualSave()" title="立即写入 IndexedDB、生成历史快照并同步本地 JSON (Ctrl+S)"
            class="hdr-ctrl hdr-primary">
            <span id="dirtyDot" class="hidden w-1.5 h-1.5 rounded-full bg-amber-300 dirty-pulse"></span>
            <span id="manualSaveIcon">💾</span>
            <span id="manualSaveText">手动保存</span>
            <kbd class="hidden 2xl:inline-block ml-0.5 px-1.5 py-0.5 text-[10px] font-medium bg-white/20 rounded">Ctrl+S</kbd>
          </button>

          <!-- 历史快照 -->
          <button onclick="openSnapshotModal()" class="hdr-ctrl hdr-ghost">
            🕒 历史快照
            <span id="snapshotCountBadge" class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600">0</span>
          </button>

          <!-- 数据工具组：绑定 / 导入 / 导出 合成一整块，宽度不再参差 -->
          <div class="hdr-group">
            <button onclick="bindLocalJson()" title="绑定本地 JSON 文件，支持直接读写">📂 绑定JSON</button>
            <button onclick="document.getElementById('importFileInput').click()" title="从 JSON 文件导入数据">📥 导入</button>
            <button onclick="exportJson()" title="导出当前全部数据为 JSON 文件">📤 导出</button>
          </div>
          <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleImportFile(event)" />
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== 3 标签页导航栏 ==================== -->
  <nav class="max-w-[1380px] mx-auto px-4 sm:px-6 mt-5">
    <div class="inline-flex items-center gap-1.5 p-1.5 rounded-2xl bg-white/85 backdrop-blur border border-slate-200/80 shadow-sm overflow-x-auto max-w-full no-scrollbar">
      <button class="tab-btn active btn-tactile flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap" data-tab="math" onclick="switchTab('math')">
        <span>📐 考研数学</span>
        <span id="tabCount-math" class="tab-count px-2 py-0.5 rounded-full text-xs font-bold">0</span>
      </button>
      <button class="tab-btn btn-tactile flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap" data-tab="408" onclick="switchTab('408')">
        <span>💻 408 专业课</span>
        <span id="tabCount-408" class="tab-count px-2 py-0.5 rounded-full text-xs font-bold">0</span>
      </button>
      <button class="tab-btn btn-tactile flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap" data-tab="todo" onclick="switchTab('todo')">
        <span>📅 每日待办</span>
        <span id="tabCount-todo" class="tab-count px-2 py-0.5 rounded-full text-xs font-bold">0</span>
      </button>
      <button class="tab-btn btn-tactile flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap" data-tab="paper" onclick="switchTab('paper')">
        <span>📝 套卷记录</span>
        <span id="tabCount-paper" class="tab-count px-2 py-0.5 rounded-full text-xs font-bold">0</span>
      </button>
      <button class="tab-btn btn-tactile flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap" data-tab="stat" onclick="switchTab('stat')">
        <span>📊 统计</span>
      </button>
    </div>
  </nav>

  <!-- ==================== 主内容区 ==================== -->
  <main class="max-w-[1380px] mx-auto px-4 sm:px-6 mt-5">

    <!-- ==================== VIEW 1: 考研数学 ==================== -->
    <section id="view-math" class="view-section active">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4 mb-5" id="stats-math"></div>

      <!-- 工具栏 -->
      <div class="bg-white/95 backdrop-blur border border-slate-200/90 rounded-2xl shadow-sm p-4 mb-5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <select id="filter-subject-math" onchange="onRecordFilterChange('math')" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none"></select>
          <select id="filter-status-math" onchange="onRecordFilterChange('math')" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none">
            <option value="">全部状态</option>
            <option value="待解决">待解决</option>
            <option value="复习中">复习中</option>
            <option value="已掌握">已掌握</option>
          </select>
          <select id="sort-math" onchange="onRecordFilterChange('math')" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none">
            <option value="forgetDesc">按遗忘次数 ↓</option>
            <option value="dateDesc">按最近日期 ↓</option>
            <option value="firstDateDesc">按首次日期 ↓</option>
          </select>
          <div class="relative">
            <input type="text" id="search-math" placeholder="搜索知识点 / 来源 / 备注..." oninput="onRecordFilterChange('math')"
              class="w-full sm:w-56 pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none transition-all" />
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2.5">
          <!-- 视图切换：大卡片 / 紧凑表格 -->
          <div class="inline-flex p-1 rounded-xl bg-slate-100 border border-slate-200/80">
            <button id="viewBtn-math-card" onclick="setViewMode('math', 'card')" class="btn-tactile px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">🗂️ 大卡片</button>
            <button id="viewBtn-math-table" onclick="setViewMode('math', 'table')" class="btn-tactile px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">📋 紧凑表格</button>
          </div>
          <button onclick="openRecordModal('math')" class="btn-tactile inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-sm shadow-blue-500/20">
            ＋ 新增数学薄弱点
          </button>
        </div>
      </div>

      <!-- 数学内容容器（大卡片或表格） -->
      <div id="records-container-math"></div>
      <div id="pagination-math" class="mt-4"></div>
    </section>

    <!-- ==================== VIEW 2: 408 专业课 ==================== -->
    <section id="view-408" class="view-section">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4 mb-5" id="stats-408"></div>

      <!-- 工具栏 -->
      <div class="bg-white/95 backdrop-blur border border-slate-200/90 rounded-2xl shadow-sm p-4 mb-5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <select id="filter-subject-408" onchange="onRecordFilterChange('408')" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none"></select>
          <select id="filter-status-408" onchange="onRecordFilterChange('408')" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none">
            <option value="">全部状态</option>
            <option value="待解决">待解决</option>
            <option value="复习中">复习中</option>
            <option value="已掌握">已掌握</option>
          </select>
          <select id="sort-408" onchange="onRecordFilterChange('408')" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none">
            <option value="forgetDesc">按遗忘次数 ↓</option>
            <option value="dateDesc">按最近日期 ↓</option>
            <option value="firstDateDesc">按首次日期 ↓</option>
          </select>
          <div class="relative">
            <input type="text" id="search-408" placeholder="搜索知识点 / 来源 / 备注..." oninput="onRecordFilterChange('408')"
              class="w-full sm:w-56 pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none transition-all" />
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2.5">
          <div class="inline-flex p-1 rounded-xl bg-slate-100 border border-slate-200/80">
            <button id="viewBtn-408-card" onclick="setViewMode('408', 'card')" class="btn-tactile px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">🗂️ 大卡片</button>
            <button id="viewBtn-408-table" onclick="setViewMode('408', 'table')" class="btn-tactile px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">📋 紧凑表格</button>
          </div>
          <button onclick="openRecordModal('408')" class="btn-tactile inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm shadow-indigo-500/20">
            ＋ 新增408薄弱点
          </button>
        </div>
      </div>

      <!-- 408 内容容器 -->
      <div id="records-container-408"></div>
      <div id="pagination-408" class="mt-4"></div>
    </section>

    <!-- ==================== VIEW 3: 每日待办 ==================== -->
    <section id="view-todo" class="view-section">
      <!-- 统计条（左，4 条竖叠、自动撑满热力图高度）+ 热力图（右，固定宽度），小屏自动上下堆叠 -->
      <div class="flex flex-col lg:flex-row gap-4 mb-5">
        <div class="grid grid-cols-2 gap-3 lg:grid-cols-1 lg:auto-rows-fr lg:flex-1 min-w-0" id="stats-todo"></div>
        <div id="todo-heatmap" class="min-w-0 lg:w-[28rem] shrink-0"></div>
      </div>

      <!-- 快速添加待办 -->
      <div class="bg-white/95 backdrop-blur border border-slate-200/90 rounded-2xl shadow-sm p-4 sm:p-5 mb-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3 items-center">
          <input type="date" id="quick-todo-date" title="任务日期"
            class="lg:col-span-2 px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none" />
          <input type="text" id="quick-todo-title" placeholder="输入今日待办事项（例如：刷完李六卷3、复盘Cache写回策略），按回车快速添加..."
            onkeydown="if(event.key==='Enter') quickAddTodo()"
            class="sm:col-span-2 lg:col-span-4 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 outline-none" />
          <select id="quick-todo-cat" class="lg:col-span-1 px-2.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none">
            <option value="数学">数学</option>
            <option value="408">408</option>
            <option value="英语">英语</option>
            <option value="政治">政治</option>
            <option value="综合">综合</option>
          </select>
          <select id="quick-todo-priority" class="lg:col-span-1 px-2.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none">
            <option value="高">高优</option>
            <option value="中" selected>中优</option>
            <option value="低">低优</option>
          </select>
          <input type="text" id="quick-todo-note" placeholder="备注（可选）" onkeydown="if(event.key==='Enter') quickAddTodo()"
            class="lg:col-span-2 px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none" />
          <button onclick="quickAddTodo()" class="lg:col-span-2 btn-tactile w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-sm shadow-blue-500/20">
            ＋ 添加待办
          </button>
        </div>
      </div>

      <!-- 待办筛选工具栏 -->
      <div class="bg-white/95 backdrop-blur border border-slate-200/90 rounded-2xl shadow-sm p-4 mb-5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <button id="todo-sort-btn" onclick="toggleTodoDateSort()" class="btn-tactile px-3.5 py-2 rounded-xl text-sm font-semibold bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100">
            📅 按日期降序（最新在前）↓
          </button>
          <select id="filter-todo-status" onchange="renderTodos()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white outline-none">
            <option value="all">全部状态</option>
            <option value="pending">仅看未完成</option>
            <option value="done">仅看已完成</option>
          </select>
          <select id="filter-todo-cat" onchange="renderTodos()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white outline-none">
            <option value="">全部分类</option>
            <option value="数学">数学</option>
            <option value="408">408</option>
            <option value="英语">英语</option>
            <option value="政治">政治</option>
            <option value="综合">综合</option>
          </select>
          <input type="date" id="filter-todo-date" onchange="renderTodos()" title="按指定日期筛选"
            class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white outline-none" />
          <button onclick="clearTodoFilters()" class="btn-tactile px-3 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">
            重置筛选
          </button>
        </div>
        <div class="relative">
          <input type="text" id="search-todo" placeholder="搜索待办内容 / 备注..." oninput="renderTodos()"
            class="w-full sm:w-52 pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none" />
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
        </div>
      </div>

      <!-- 按日期分组的待办列表 -->
      <div id="todo-groups-container" class="space-y-4"></div>
    </section>

    <!-- ==================== VIEW 4: 套卷记录 ==================== -->
    <section id="view-paper" class="view-section">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4 mb-5" id="stats-paper"></div>

      <!-- 工具栏 -->
      <div class="bg-white/95 backdrop-blur border border-slate-200/90 rounded-2xl shadow-sm p-4 mb-5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <select id="filter-paper-mod" onchange="renderPapers()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none">
            <option value="">全部科目</option>
            <option value="math">考研数学</option>
            <option value="408">408 专业课</option>
          </select>
          <select id="filter-paper-cat" onchange="renderPapers()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none"></select>
          <select id="sort-paper" onchange="renderPapers()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none">
            <option value="dateDesc">按日期 ↓</option>
            <option value="scoreDesc">按总分 ↓</option>
            <option value="scoreAsc">按总分 ↑</option>
          </select>
          <div class="relative">
            <input type="text" id="search-paper" placeholder="搜索卷名 / 错误点 / 备注..." oninput="renderPapers()"
              class="w-full sm:w-56 pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm text-slate-700 focus:bg-white focus:border-blue-500 outline-none" />
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
          </div>
        </div>
        <button onclick="openPaperModal()" class="btn-tactile inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm shadow-emerald-500/20">

      </div>

        <button onclick="closeConfirmModal(false)" class="btn-tactile px-4 py-2 rounded-xl text-sm font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">取消</button>
        <button id="confirmOkBtn" onclick="closeConfirmModal(true)" class="btn-tactile px-4 py-2 rounded-xl text-sm font-semibold bg-red-600 text-white hover:bg-red-700 shadow-sm">确认</button>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL 4.5: 卡片详情查看（FLIP 平滑动画） ==================== -->
  <div id="viewerModal" class="modal-backdrop" onclick="if(event.target===this) closeRecordViewer()">
    <div id="viewerPanel" class="viewer-panel bg-white rounded-2xl w-full max-w-3xl shadow-2xl border border-slate-100 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
        <h3 class="text-base font-bold text-slate-900">🔍 薄弱点详情</h3>
        <button onclick="closeRecordViewer()" class="btn-tactile w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-200/70 hover:text-slate-700">✕</button>
      </div>
      <div id="viewerBody" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto"></div>
      <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/70 flex justify-end gap-2.5">
        <button onclick="closeRecordViewer()" class="btn-tactile px-4 py-2 rounded-xl text-sm font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">关闭</button>
        <button id="viewerEditBtn" class="btn-tactile px-5 py-2 rounded-xl text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-sm">✏️ 编辑此记录</button>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-[200] flex flex-col gap-2.5 pointer-events-none"></div>
